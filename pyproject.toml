[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lirik-studio"
version = "1.0.0"
description = "Nine specialist agents that turn a music idea into one production-ready Suno prompt."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lirik-studio = "suno_agents.__main__:main"

[tool.setuptools.packages.find]
include = ["suno_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:audioop",
]
